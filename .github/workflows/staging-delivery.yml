name: Staging Delivery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Staging Candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Sync tests
        run: npm run test:sync

      - name: AI tests
        run: npm run test:ai

      - name: DOCX tests
        run: npm run test:docx

  staging-build:
    name: Build iOS Staging
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS CLI
        run: npm install --global eas-cli@23.2.0


      - name: Trigger Staging iOS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile staging --non-interactive --auto-submit
